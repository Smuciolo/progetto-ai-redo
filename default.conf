server {
    listen 80;
    server_name localhost;

    # 1. FRONTEND: Serve la pagina web (HTML, JS, CSS)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. BACKEND: Smista le richieste all'IA (Server MCP)
    location /api/ {
        proxy_pass http://mcp-server:8000/; # Usa il nome del servizio nel compose
        proxy_http_version 1.1;
        
        # Configurazioni per non bloccare lo streaming SSE dell'IA
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_cache_off;
        proxy_buffering off;
        proxy_read_timeout 24h;
        
        # Passa l'IP dei dipendenti al server Python
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}