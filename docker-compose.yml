services:
  # -------------------------------------------------------------------------
  # 1. L'ORCHESTRATORE (Il tuo Server MCP con i Bivi e i Tool)
  # -------------------------------------------------------------------------
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-enterprise-server
    environment:
    # cambiare valore ai mode in locale se non uso groq 
      - AI_MODE=groq
      - GROQ_HOST=https://api.groq.com/openai
      - GROQ_API_KEY=${GROQ_API_KEY}
      - VLLM_HOST=http://vllm-engine:8000

  # -------------------------------------------------------------------------
  # 2. IL FRONTEND (La pagina web per i dipendenti)
  # -------------------------------------------------------------------------
  web-frontend:
    image: nginx:alpine
    container_name: web-enterprise-frontend
    ports:
      - "80:80"  # Espone la pagina web sulla porta standard HTTP (http://localhost)
    volumes:
      - ./html:/usr/share/nginx/html  # Mappa la cartella del tuo PC dentro il server Web
    depends_on:
      - mcp-server