services:
  # -------------------------------------------------------------------------
  # 1. L'ORCHESTRATORE (Il tuo Server MCP con i Bivi e i Tool)
  # -------------------------------------------------------------------------
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-enterprise-server
    # NOTA: La riga 'ports' è sparita, il backend è protetto all'interno!
    environment:
      - AI_MODE=groq
      - GROQ_HOST=https://api.groq.com/openai
      - GROQ_API_KEY=${GROQ_API_KEY}
      - VLLM_HOST=http://vllm-engine:8000

  # -------------------------------------------------------------------------
  # 2. IL FRONTEND + REVERSE PROXY (L'unico punto di accesso per gli utenti)
  # -------------------------------------------------------------------------
  web-frontend:
    image: nginx:alpine
    container_name: web-enterprise-frontend
    ports:
      - "80:80"  # Espone la pagina sulla porta standard http://localhost
    volumes:
      - ./html:/usr/share/nginx/html  # I file HTML del tuo frontend
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro # 👈 Monta la configurazione di Nginx
    depends_on:
      - mcp-server