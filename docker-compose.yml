services:
  # ==========================================
  # 1. IL MOTORE IA (vLLM) - CONFIGURAZIONE IBRIDA
  # ==========================================
  vllm-engine:
    image: vllm/vllm-openai:latest
    container_name: vllm-server
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
    ports:
      - "8000:8000"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface

    # -------------------------------------------------------------------------
    # OPZIONE A: SE SEI SUL SERVER CON SCHEDA NVIDIA (Attiva questo blocco)
    # ------------------------------------------------------------------------- 
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    # command: --model Qwen/Qwen2.5-7B-Instruct --host 0.0.0.0 --port 8000

    # -------------------------------------------------------------------------
    # OPZIONE B: SE SEI SUL PORTATILE (Senza Nvidia)
    # Per usarla: metti il '#' davanti al blocco 'deploy' e 'command' di sopra,
    # e togli il '#' dalle due righe qui sotto:
    # -------------------------------------------------------------------------
    command: --model Qwen/Qwen2.5-1.5B-Instruct --host 0.0.0.0 --port 8000 --device cpu


  # ==========================================
  # 2. IL TUO SERVER MCP (I codici fiscali)
  # ==========================================
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-enterprise-server
    depends_on:
      - vllm-engine
    # In modalità stdio (quella attuale del tuo server.py) le porte non servono.
    # Se un giorno passerai alla modalità web "sse", togli il '#' dalle due righe sotto:
    # ports:
    #   - "5000:5000"