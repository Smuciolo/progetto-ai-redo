<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Enterprise Portal</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }
        .chat-container {
            width: 100%;
            max-width: 700px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h2 { color: #1e293b; margin-top: 0; }
        p { color: #64748b; font-size: 14px; }
        textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            resize: none;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            float: right;
            transition: background 0.2s;
        }
        button:hover { background-color: #1d4ed8; }
        .result-box {
            margin-top: 70px;
            padding: 20px;
            background-color: #f8fafc;
            border-left: 4px solid #2563eb;
            border-radius: 4px;
            min-height: 50px;
            color: #334155;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <h2>Interfaccia IA Aziendale</h2>
    <p>Inserisci la tua richiesta. L'orchestratore MCP smisterà la richiesta al motore ideale.</p>
    
    <textarea id="promptInput" placeholder="Scrivi qui la tua domanda per l'IA aziendale..."></textarea>
    <button onclick="inviaRichiesta()">Invia Prompt</button>

    <div class="result-box" id="outputRisposta">La risposta dell'IA comparirà qui...</div>
</div>

<script>
    async function inviaRichiesta() {
        const promptInput = document.getElementById('promptInput');
        const output = document.getElementById('outputRisposta');
        const promptText = promptInput.value.trim();
        
        if (!promptText) {
            alert("Scrivi qualcosa prima di inviare!");
            return;
        }

        output.innerText = "🤖 L'orchestratore sta elaborando e smistando la richiesta...";
        output.style.borderLeftColor = "#e2e8f0";

        try {
            // Chiamata HTTP al nostro container backend sulla porta 8000
            const response = await fetch('http://localhost:8000/api/chiedi', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ prompt: promptText })
            });

            if (!response.ok) {
                throw new Error(`Errore del server: ${response.status}`);
            }

            const data = await response.json();
            output.innerText = data.risposta;
            output.style.borderLeftColor = "#2563eb";

        } catch (error) {
            output.innerText = `❌ Impossibile ottenere una risposta.\nAssicurati che Docker sia attivo.\nDettaglio: ${error.message}`;
            output.style.borderLeftColor = "#ef4444";
        }
    }
</script>

</body>
</html>
