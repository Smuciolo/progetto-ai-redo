<script>
    async function inviaRichiesta() {
        const promptInput = document.getElementById('promptInput');
        const output = document.getElementById('outputRisposta');
        const promptText = promptInput.value.trim();
        
        if (!promptText) {
            alert("Scrivi qualcosa prima di inviare!");
            return;
        }

        output.innerText = "🤖 L'orchestratore sta elaborando e smistando la richiesta...";
        output.style.borderLeftColor = "#e2e8f0";

        try {
            // 👇 MODIFICATO: Rimosso 'http://localhost:8000'. Ora passa da Nginx sulla porta 80.
            // Controlla anche che sul tuo server.py l'endpoint sia effettivamente '/api/chiedi' o '/chiedi'
            const response = await fetch('/api/chiedi', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ prompt: promptText })
            });

            if (!response.ok) {
                throw new Error(`Errore del server: ${response.status}`);
            }

            const data = await response.json();
            output.innerText = data.risposta;
            output.style.borderLeftColor = "#2563eb";

        } catch (error) {
            output.innerText = `❌ Impossibile ottenere una risposta.\nAssicurati che i container Docker siano attivi.\nDettaglio: ${error.message}`;
            output.style.borderLeftColor = "#ef4444";
        }
    }
</script>
